<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoFood - Registro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .diseño {
      max-width: 400px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #4b6b3c;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #6a9352;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #5b8148;
    }
    .toggle {
      text-align: center;
      margin-top: 15px;
    }
    .toggle a {
      color: #6a9352;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="diseño">
    <h2>Registrarse</h2>
    <form id="register-form">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" id="name" required />
      </div>
      <div class="form-group">
        <label for="email">Correo</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit">Crear Cuenta</button>
      <div class="toggle">
        ¿Ya tienes cuenta? <a href="login.html">Iniciar Sesión</a>
      </div>
    </form>
  </div>
  <script>
    document.getElementById("register-form").addEventListener("submit", function(e) {
      e.preventDefault();
      window.location.href = "login.html"; 
    });
  </script>
</body>
</html>
