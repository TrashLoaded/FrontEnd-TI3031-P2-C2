<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoFood - Iniciar Sesión</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .diseño {
      max-width: 400px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    h2 {
      color: #4b6b3c;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #6a9352;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #5b8148;
    }
    .toggle {
      margin-top: 15px;
    }
    .toggle a {
      color: #6a9352;
      text-decoration: none;
    }
    #success-message {
      display: none;
      font-size: 20px;
      color: #4b6b3c;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="diseño">
    <form id="login-form">
      <h2>Iniciar Sesión</h2>
      <div class="form-group">
        <label for="email">Correo</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit">Ingresar</button>
      <div class="toggle">
        ¿No tienes cuenta? <a href="register.html">Regístrate</a> 
        ¿Se te olvido la Contraseña? <a href="recuperar.html">Recuperar Contraseña</a>
      </div>
    </form>

    <div id="success-message">¡Ingreso con Éxito!</div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("login-form").style.display = "none";
      document.getElementById("success-message").style.display = "block";
    });
  </script>
</body>
</html>
